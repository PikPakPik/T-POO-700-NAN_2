name: Elixir CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-elixir@v1
        with:
          otp-version: '22.2' # Version d'Erlang (our version : 27.0)
          elixir-version: '1.9.4' # Version d'Elixir (our version : 1.17.3)
      - run: mix deps.get
      - run: mix test