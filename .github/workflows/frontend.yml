name: Frontend
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
      working-directory: frontend
    - name: Build
      run: npm run build
      working-directory: frontend
  build-and-push-image:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./frontend/Dockerfile
            image: pikpak/time-manager-front-nan-2
            context: ./frontend
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
      - name: Build and push Docker Image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Send image name with tags
        run: |
          echo "URL: ${{ matrix.image }}:${{ steps.meta.outputs.tags }}"
      - name: Render Redeploy Action
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: qbaware/render-redeploy-action@v0.3.3
        with:
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          render-service-id: ${{ secrets.RENDER_SERVICEID_FRONTEND }}
  build-apk-artifact:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        working-directory: ./frontend
        run: |
          npm install
          npm install -g cordova

      - name: Install npm dependencies
        working-directory: ./frontend
        run: |
          npm run build
          npm run generate

      - name: Prepare Cordova
        working-directory: ./frontend/TimeManagerApp
        run: cordova platform add android

      - name: Build APK
        working-directory: ./frontend/TimeManagerApp
        run: |
          cordova build android --release -- --packageType=apk 
          mv ./platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ./app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./frontend/TimeManagerApp/app-release.apk
