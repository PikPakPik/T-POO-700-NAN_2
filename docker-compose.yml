version: "3.8"

services:
  api:
    image: docker.io/pikpak/time-manager-api-nan-2:latest
    depends_on:
      - db
    ports:
      - 4000:4000
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    env_file:
      - .env

  web:
    image: docker.io/pikpak/time-manager-front-nan-2:latest
    depends_on:
      - api
    ports:
      - 3000:3000
    env_file:
      - .env
